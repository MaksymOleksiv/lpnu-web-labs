version: '3.8'

services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: stadium-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
      POSTGRES_PORT: 5432
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stadium-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d dbname"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stadium-backend
    environment:
      DB_USER: user
      DB_PASSWORD: password
      DB_HOST: database
      DB_NAME: dbname
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - stadium-network
    volumes:
      - ./backend:/app
    restart: unless-stopped

  # Frontend (Node.js + serve)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stadium-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - stadium-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  stadium-network:
    driver: bridge